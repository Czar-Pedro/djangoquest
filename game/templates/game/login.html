{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Django Quest - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Press Start 2P', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("{% static 'game/login_bg.png' %}");
            background-size: cover;
            background-position: 10% 25%;
            filter: brightness(1.6);
            z-index: -1;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 0;
        }

        /* ═══════════════════════════════════════════════
           SCALE ENGINE
           O wrapper é desenhado em tamanho fixo (px),
           igual ao design original. O JS escala tudo
           proporcionalmente para qualquer resolução.
        ═══════════════════════════════════════════════ */
        .viewport-scale {
            position: relative;
            z-index: 1;

            /* Dimensões de design — tamanho natural do conteúdo */
            width: 420px;
            height: auto;

            transform-origin: center center;
            transform: scale(var(--scale, 1));
        }

        /* ── Título ─────────────────────────────────── */
        .title {
            text-align: center;
            margin-bottom: 2rem;
        }

        .title h1 {
            font-size: 20px;
            color: #c8e6c0;
            text-shadow: 0 0 10px #2d6a3f, 0 2px 0 #000;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        .title p {
            font-size: 7px;
            color: #6aad72;
            letter-spacing: 1px;
        }

        /* ── Painel ─────────────────────────────────── */
        .panel {
            background: rgba(8, 20, 10, 0.88);
            border: 3px solid #1e3d24;
            box-shadow: 4px 4px 0 #000, 0 0 24px rgba(13, 42, 26, 0.8);
            padding: 2rem;
            position: relative;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid #1a3020;
            pointer-events: none;
        }

        .panel-title {
            font-size: 10px;
            color: #6aad72;
            margin-bottom: 1.5rem;
            text-align: center;
            letter-spacing: 2px;
        }

        /* ── Campos ─────────────────────────────────── */
        .field {
            margin-bottom: 1.25rem;
        }

        .field label {
            display: block;
            font-size: 7px;
            color: #4a7a52;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .field input {
            width: 100%;
            background: #060d08;
            border: 2px solid #1e3d24;
            color: #a8d8b0;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            padding: 0.75rem;
            outline: none;
            box-shadow: inset 2px 2px 0 #000;
        }

        .field input:focus {
            border-color: #3d8a4a;
            box-shadow: inset 2px 2px 0 #000, 0 0 6px #1a4a22;
        }

        /* ── Botão ──────────────────────────────────── */
        .btn {
            width: 100%;
            background: #1a3d22;
            border: 2px solid #3d8a4a;
            color: #a8d8b0;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            padding: 0.875rem;
            cursor: pointer;
            letter-spacing: 1px;
            margin-top: 0.5rem;
            box-shadow: 3px 3px 0 #000;
            transition: all 0.1s;
        }

        .btn:hover {
            background: #245230;
            color: #c8e6c0;
            box-shadow: 1px 1px 0 #000;
            transform: translate(2px, 2px);
        }

        .btn:active {
            transform: translate(3px, 3px);
            box-shadow: none;
        }

        /* ── Rodapé ─────────────────────────────────── */
        .register {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 7px;
            color: #4a7a52;
            letter-spacing: 1px;
        }

        .register a {
            color: #6aad72;
            text-decoration: none;
        }

        .register a:hover { color: #a8d8b0; }

        .divider {
            border: none;
            border-top: 1px solid #1a3020;
            margin: 1.25rem 0;
        }

        .erro {
            font-size: 7px;
            color: #e05555;
            text-align: center;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        /* ── Fallback mobile portrait ────────────────── */
        @media (max-width: 500px) {
            .viewport-scale {
                width: 90vw;
                transform: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="viewport-scale" id="vp">
        <div class="title">
            <h1>CORRUPÇÃO</h1>
            <p>► uma aventura começa aqui ◄</p>
        </div>

        <div class="panel">
            <div class="panel-title">▸ ENTRAR ◂</div>

            {% if erro %}
                <p class="erro">{{ erro }}</p>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="field">
                    <label>USUÁRIO</label>
                    <input type="text" name="usuario" placeholder="nome de usuario" autocomplete="username">
                </div>
                <div class="field">
                    <label>SENHA</label>
                    <input type="password" name="senha" placeholder="••••••••" autocomplete="current-password">
                </div>
                <button type="submit" class="btn">▶ ENTRAR</button>
            </form>

            <hr class="divider">

            <div class="register">
                não tem conta? <a href="{% url 'cadastro' %}">cadastre-se</a>
            </div>
        </div>
    </div>

    <script>
        // ── Scale Engine ────────────────────────────────────────────
        // Mesmo mecanismo da tela de criar personagem:
        // escala o conteúdo desenhado em px para caber em qualquer tela.
        //
        // DESIGN_W: largura natural do painel (420px, igual ao max-width original)
        // DESIGN_H: altura estimada do conteúdo (~420px para o painel de login)
        //
        // Math.min(scaleX, scaleY) garante que nenhum eixo ultrapassa a viewport.

        const DESIGN_W = 420;
        const DESIGN_H = 420;   // estimativa conservadora da altura total
        const vp = document.getElementById('vp');

        function applyScale() {
            if (window.innerWidth <= 500) return;   // mobile: CSS cuida

            const scaleX = window.innerWidth  / (DESIGN_W * 2.2);  // margem lateral generosa
            const scaleY = window.innerHeight / (DESIGN_H * 1.4);  // margem vertical
            const scale  = Math.min(scaleX, scaleY, 2.5);          // teto: nunca passa de 2.5×

            vp.style.setProperty('--scale', scale);
        }

        applyScale();
        window.addEventListener('resize', applyScale);
    </script>
</body>
</html>
