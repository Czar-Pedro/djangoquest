<!DOCTYPE html>
<html>
<head>
    <title>Django Quest - Login</title>
</head>
<body>
    <h1>Django Quest</h1>
    <h2>Login</h2>
    <form method="POST">
        {% csrf_token %}
        <label>Usuário:</label>
        <input type="text" name="usuario"><br><br>
        <label>Senha:</label>
        <input type="password" name="senha"><br><br>
        <button type="submit">Entrar</button>
    </form>
    <p>Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
</body>
</html>
