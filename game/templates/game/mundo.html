{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Django Quest - Mundo</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Press Start 2P', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            /* cor do oceano do mapa para preencher as laterais */
            background-color: #c9a8c0;
        }

        /* ============================
           MAPA — imagem centralizada
           min(90vh, 90vw) garante que
           o mapa seja sempre quadrado
           e caiba em qualquer tela
        ============================ */
        .mapa-wrapper {
            position: relative;
            width: min(90vh, 90vw);
            height: min(90vh, 90vw);
            flex-shrink: 0;
        }

        .mapa-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            /* mantém pixels nítidos sem blur ao escalar */
            image-rendering: pixelated;
        }

        /* overlay roxo levíssimo para dar profundidade */
        .mapa-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(80, 40, 90, 0.12);
            pointer-events: none;
        }

        /* ============================
           REINOS — sobre o mapa
           % relativos ao .mapa-wrapper
        ============================ */
        .reinos {
            position: absolute;
            inset: 0;
            z-index: 5;
        }

        .reino-btn {
            position: absolute;
            /* ancora o botão pelo seu centro */
            transform: translate(-50%, -50%);
            background: rgba(50, 20, 60, 0.45);  /* era 0.82 */
            border: 1px solid rgba(155, 106, 181, 0.5); /* era 2px solid #9b6ab5 */
            box-shadow: none;
            color: #e8c8f5;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.3rem, 0.5vw, 0.5rem);
            padding: 0.2rem 0.4rem;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            box-shadow: 3px 3px 0 #2a1040;
            transition: all 0.15s;
            letter-spacing: 0.05em;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            white-space: nowrap;
        }

        .reino-btn:hover {
            background: rgba(100, 55, 130, 0.95);
            box-shadow: 1px 1px 0 #2a1040;
            transform: translate(calc(-50% + 1px), calc(-50% + 1px));
            color: #f5e0ff;
            border-color: #c8a0e0;
        }

        /* botão bloqueado — tom apagado */
        .reino-btn.bloqueado {
            background: rgba(30, 15, 40, 0.75);
            border-color: rgba(100, 70, 120, 0.5);
            color: rgba(180, 140, 200, 0.45);
            cursor: not-allowed;
            box-shadow: none;
        }

        .reino-btn.bloqueado:hover {
            transform: translate(-50%, -50%);
            box-shadow: none;
            background: rgba(30, 15, 40, 0.75);
            border-color: rgba(100, 70, 120, 0.5);
            color: rgba(180, 140, 200, 0.45);
        }

        .reino-icone { font-size: 1em; }
        .reino-nome  { font-size: 0.85em; }
        .reino-lock  { font-size: 1em; opacity: 0.6; }

        /*
         * Posições sobre o mapa — ajuste com F12
         * até encaixar em cima de cada ilha:
         *   Reino (mapa)  → ilha grande topo-centro (~42% left, ~25% top)
         */
        .reino-principal { top: 40%; left: 19.5%; }

        /* ============================
           HUD — canto superior direito
        ============================ */
        .hud {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 20;
            background: rgba(50, 20, 60, 0.88);
            border: 2px solid #9b6ab5;
            padding: 1.4rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .hud-nome {
            font-size: clamp(0.6rem, 1.2vw, 1rem);
            color: #e8c8f5;
            letter-spacing: 0.05em;
        }

        .hud-info {
            font-size: clamp(0.5rem, 1vw, 0.75rem);
            color: #b88fd0;
            letter-spacing: 0.05em;
        }

        /* ============================
           NAV — rodapé
        ============================ */
        .nav {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 0.75rem;
        }

        .btn-nav {
            background: rgba(50, 20, 60, 0.88);
            border: 1.5px solid #9b6ab5;
            color: #e8c8f5;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.3rem, 0.65vw, 0.45rem);
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            box-shadow: 2px 2px 0 #2a1040;
            transition: all 0.1s;
            letter-spacing: 0.05em;
        }

        .btn-nav:hover {
            background: rgba(90, 50, 110, 0.95);
            box-shadow: 1px 1px 0 #2a1040;
            transform: translate(1px, 1px);
            color: #f5e0ff;
        }

        .btn-nav-sair {
            background: transparent;
            color: #9b6ab5;
            box-shadow: none;
            border-color: rgba(155, 106, 181, 0.5);
        }

        .btn-nav-sair:hover {
            background: rgba(50, 20, 60, 0.4);
            box-shadow: none;
            transform: none;
            color: #c8a0e0;
        }
    </style>
</head>
<body>

    <!-- HUD com info do personagem -->
    <div class="hud">
        <div class="hud-nome">{{ personagem.nome }}</div>
        <div class="hud-info">{{ personagem.get_classe_display }} · Nível {{ personagem.nivel }}</div>
        <div class="hud-info">⚔ {{ personagem.ataque }} &nbsp; 🛡 {{ personagem.defesa }} &nbsp; 💰 {{ personagem.gold }}</div>
    </div>

    <!-- mapa como imagem centralizada -->
    <div class="mapa-wrapper">
        <img src="{% static 'game/mundo_bg.png' %}" class="mapa-img" alt="Mapa Mundo">

        <!-- reinos posicionados sobre o mapa -->
        <div class="reinos">

            <!-- reino principal — leva para mapa/ que lista as áreas -->
            <a href="{% url 'mapa' %}" class="reino-btn reino-principal">
                <span class="reino-icone">⚔️</span>
                <span class="reino-nome">REINO 1</span>
            </a>

        </div>
    </div>

    <!-- navegação inferior -->
    <nav class="nav">
        <a href="{% url 'selecionar_personagem' %}" class="btn-nav">◀ TROCAR HERÓI</a>
        <a href="{% url 'logout' %}" class="btn-nav btn-nav-sair">SAIR</a>
    </nav>

</body>
</html>
